name: Pull Request Quality Check

on:
  pull_request:
    branches:
      - development
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate

      - name: Check architecture
        run: npm run architecture

      - name: Check duplicated code
        run: npm run duplication

      - name: Lint code
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Comment PR on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              filter: 'latest',
              per_page: 100,
            });
            const currentJob = data.jobs.find((job) => job.name === context.job);
            const failedSteps = currentJob?.steps
              .filter((step) => step.conclusion === 'failure')
              .map((step) => `- ${step.name}`) ?? [];
            const failureSummary = failedSteps.length > 0
              ? `**Failed check(s):**\n${failedSteps.join('\n')}`
              : 'A quality-check step failed. Review the workflow logs for details.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Quality check failed!**\n\n${failureSummary}\n\n[View workflow logs](${runUrl})`,
            });

      - name: Comment PR on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Success! All checks have passed successfully!** \n\n' +
                    '- Build completed ✓\n' +
                    '- Tests passed ✓\n' +
                    '- Linter Code quality verified ✓\n' +
                    '- Architecture rules verified ✓\n\n' +
                    'The PR has been validated. Great work! 🎉'
            })
